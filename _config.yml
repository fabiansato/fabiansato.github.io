title: Fabián Sato
description: "Desarrollo frontend, Adobe Experience Manager y experiencias digitales. Portfolio y blog de Fabián Sato."
url: "https://fabiansato.github.io"
baseurl: ""
lang: es
languages: [es, en]
timezone: America/Argentina/Buenos_Aires

markdown: kramdown
highlighter: rouge
permalink: /blog/:slug/
strict_front_matter: true
liquid:
  error_mode: strict
plugins:
  - jekyll-sitemap

collections:
  pages:
    output: true
    permalink: /:name/
  posts:
    output: true
    permalink: /blog/:slug/
  projects:
    output: true
    permalink: /project/:slug/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: es
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - .bundle
  - .claude
  - .github
  - .ruby-version
  - bin
  - docs
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - change.log
  - assets/README.md

sass:
  sass_dir: _sass
  style: compressed
