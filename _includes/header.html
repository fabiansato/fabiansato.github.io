<header class="site-header container">
<a href="{{ t.home | relative_url }}" class="wordmark" aria-label="Fabian Sato — {{ language }}">fabian<span>sato</span>
<span class="brand-dot">.</span>
</a>
<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" data-open="{{ t.menu }}" data-close="{{ t.close_menu }}">{{ t.menu }} <span aria-hidden="true">☰</span>
</button>
<nav id="main-nav" aria-label="{% if language == 'es' %}Navegación principal{% else %}Main navigation{% endif %}">
<a href="{{ t.projects_url | relative_url }}" {% if page.section == 'projects' or page.layout == 'project' %}aria-current="page"{% endif %}>{{ t.nav_work }}</a>
<a href="{{ t.blog_url | relative_url }}" {% if page.section == 'blog' or page.layout == 'post' %}aria-current="page"{% endif %}>Blog</a>
<a href="{{ t.about_url | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>{{ t.nav_about }}</a>
<a class="language-link" href="{{ page.translation_url | default: t.other_home | relative_url }}" lang="{{ t.other_lang }}" hreflang="{{ t.other_lang }}" aria-label="{{ t.other_label }}">{{ t.other_lang | upcase }}</a>
<a class="nav-contact" href="mailto:fabiangonzalezdev@gmail.com">{{ t.contact }} <span aria-hidden="true">↗</span>
</a>
</nav>
</header>
